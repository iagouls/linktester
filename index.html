<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexis App | Ultra Link Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Light Mode Vars */
            --primary: #ff4b7d;
            --primary-hover: #e63e6d;
            --bg: #f8faff;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #eef2f6;
            --input-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --smoke-opacity: 0.4;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
            --shadow: 0 10px 40px rgba(0,0,0,0.3);
            --smoke-opacity: 0.15;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Efeito de Fumaça Animada no Fundo */
        .smoke-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            background: var(--bg);
        }

        .smoke-blob {
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            filter: blur(80px);
            opacity: var(--smoke-opacity);
            border-radius: 50%;
            animation: move 20s infinite alternate ease-in-out;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%) scale(1); }
            to { transform: translate(30%, 20%) scale(1.2); }
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--surface);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            z-index: 1;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        header {
            padding: 25px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-circle {
            width: 50px; height: 50px;
            background: var(--primary);
            border-radius: 14px;
            display: flex;
            align-items: center; justify-content: center;
            color: white; font-weight: 700; font-style: italic; font-size: 24px;
            box-shadow: 0 4px 15px rgba(255, 75, 125, 0.4);
        }

        .brand h1 { font-size: 24px; letter-spacing: -0.5px; }

        .header-actions { display: flex; align-items: center; gap: 20px; }

        .theme-toggle {
            cursor: pointer;
            width: 45px; height: 45px;
            border-radius: 12px;
            background: var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            border: none; color: var(--text);
        }

        /* Main Content */
        main { padding: 40px; }

        .section-title {
            margin-bottom: 25px;
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex; align-items: center; gap: 10px;
        }

        /* Platform Selection */
        .platform-chips {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 35px;
        }

        .chip {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            background: var(--input-bg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }

        .chip i { font-size: 20px; margin-bottom: 4px; }
        .chip:hover { border-color: var(--primary); transform: translateY(-2px); }
        .chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(255, 75, 125, 0.3);
        }

        /* Inputs */
        .input-group { margin-bottom: 25px; display: flex; flex-direction: column; gap: 10px; }
        label { font-size: 14px; font-weight: 600; color: var(--text-secondary); }

        input, textarea {
            width: 100%;
            padding: 15px;
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        input:focus, textarea:focus { border-color: var(--primary); }

        /* Dynamic Params Grid */
        .params-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            background: var(--bg);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 35px;
        }

        .param-item label { font-size: 11px; margin-bottom: 5px; }
        .param-item input { padding: 8px 12px; font-size: 12px; }

        /* Buttons */
        .actions { display: flex; gap: 20px; }
        .btn {
            flex: 1;
            padding: 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            border: none;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-generate { background: var(--primary); color: white; }
        .btn-clear { background: var(--border); color: var(--text-secondary); }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

        /* Result Card */
        .result-area {
            margin-top: 40px;
            padding: 30px;
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid rgba(46, 204, 113, 0.2);
            border-radius: 20px;
            display: none;
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .result-url-wrapper {
            position: relative;
            background: var(--input-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin: 15px 0;
            overflow: hidden;
        }

        .result-url {
            display: block;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--text);
            padding-right: 50px;
        }

        .btn-copy {
            position: absolute;
            right: 10px; top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            color: white;
            border: none;
            width: 40px; height: 40px;
            border-radius: 8px;
            cursor: pointer;
        }

        .result-actions { display: flex; gap: 15px; margin-top: 20px; }
        .btn-test-link {
            flex: 2;
            background: #2ecc71;
            color: white;
            text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; font-weight: 600;
        }

        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 14px; font-weight: 600;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
        }

        footer {
            padding: 30px;
            text-align: center;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="smoke-bg">
    <div class="smoke-blob" style="top: 10%; left: 10%;"></div>
    <div class="smoke-blob" style="bottom: 10%; right: 10%; animation-delay: -5s;"></div>
</div>

<div id="toast">Copiado com sucesso!</div>

<div class="container">
    <header>
        <div class="logo-area">
            <div class="logo-circle">Gn</div>
            <div class="brand">
                <h1>Nexis App</h1>
            </div>
        </div>
        <div class="header-actions">
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
                <i class="fa-solid fa-moon"></i>
            </button>
            <div class="creator">
                <span style="font-size: 11px; color: var(--text-secondary);">Developed by</span><br>
                <strong>Iago</strong>
            </div>
        </div>
    </header>

    <main>
        <div class="section-title"><i class="fa-solid fa-layer-group"></i> 1. Selecionar Plataforma</div>
        <div class="platform-chips" id="platformChips">
            <div class="chip active" data-platform="google"><i class="fa-brands fa-google"></i>Google Ads</div>
            <div class="chip" data-platform="facebook"><i class="fa-brands fa-facebook-f"></i>Facebook Ads</div>
            <div class="chip" data-platform="tiktok"><i class="fa-brands fa-tiktok"></i>TikTok Ads</div>
            <div class="chip" data-platform="taboola"><i class="fa-solid fa-bolt"></i>Taboola</div>
            <div class="chip" data-platform="custom"><i class="fa-solid fa-shield-halved"></i>Cloaker/Custom</div>
        </div>

        <div class="grid-inputs">
            <div class="input-group">
                <label>Landing Page URL</label>
                <input type="text" id="lpUrl" placeholder="Ex: https://seusite.com/oferta">
            </div>
            <div class="input-group">
                <label>Tracking Template (Modelo)</label>
                <textarea id="trackingTemplate" rows="3"></textarea>
            </div>
        </div>

        <div class="section-title"><i class="fa-solid fa-sliders"></i> 2. Valores das Macros</div>
        <div class="params-grid" id="paramsGrid"></div>

        <div class="actions">
            <button class="btn btn-clear" onclick="clearAll()"><i class="fa-solid fa-eraser"></i> Limpar</button>
            <button class="btn btn-generate" onclick="generateLink()"><i class="fa-solid fa-wand-magic-sparkles"></i> Gerar Link Completo</button>
        </div>

        <div class="result-area" id="resultArea">
            <div id="cloakerStatus"></div>
            <label>Link Gerado:</label>
            <div class="result-url-wrapper">
                <code class="result-url" id="finalUrlDisplay"></code>
                <button class="btn-copy" onclick="copyToClipboard()" title="Copiar Link">
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>
            <div class="result-actions">
                <a href="#" target="_blank" id="testLink" class="btn btn-test-link">
                    <i class="fa-solid fa-external-link"></i> Abrir Link em Nova Aba
                </a>
            </div>
        </div>
    </main>

    <footer>
        <p style="font-size: 12px; color: var(--text-secondary);">Nexis Ultra Link Tester &copy; 2026 | Marketing Tech Tool</p>
    </footer>
</div>
