<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexis App | Priority Link Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff4b7d;
            --primary-hover: #e63e6d;
            --bg: #f8faff;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666;
            --border: #eef2f6;
            --input-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --smoke-opacity: 0.4;
            --priority-bg: rgba(255, 75, 125, 0.05);
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
            --shadow: 0 10px 40px rgba(0,0,0,0.3);
            --smoke-opacity: 0.15;
            --priority-bg: rgba(255, 75, 125, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; overflow-x: hidden; position: relative; }
        .smoke-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: var(--bg); overflow: hidden; }
        .smoke-blob { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, var(--primary) 0%, transparent 70%); filter: blur(80px); opacity: var(--smoke-opacity); border-radius: 50%; animation: move 20s infinite alternate ease-in-out; }
        @keyframes move { from { transform: translate(-10%, -10%); } to { transform: translate(30%, 20%); } }
        .container { width: 100%; max-width: 850px; background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--shadow); z-index: 1; animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        header { padding: 25px 40px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .logo-circle { width: 50px; height: 50px; background: var(--primary); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-style: italic; font-size: 24px; }
        .header-actions { display: flex; align-items: center; gap: 20px; }
        .theme-toggle { cursor: pointer; width: 45px; height: 45px; border-radius: 12px; background: var(--border); border: none; color: var(--text); display: flex; align-items: center; justify-content: center; }
        main { padding: 40px; }
        .section-title { margin-bottom: 20px; font-size: 13px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .platform-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 30px; }
        .chip { padding: 12px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; text-align: center; font-size: 11px; font-weight: 600; background: var(--input-bg); display: flex; flex-direction: column; gap: 5px; }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }
        .input-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
        input, textarea { width: 100%; padding: 14px; background: var(--input-bg); border: 2px solid var(--border); border-radius: 12px; color: var(--text); outline: none; }
        input:focus, textarea:focus { border-color: var(--primary); }
        .params-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; background: var(--bg); padding: 20px; border-radius: 16px; margin-bottom: 30px; }
        .param-item label { font-size: 10px; display: block; margin-bottom: 4px; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; }
        .param-item input { padding: 10px 12px; font-size: 12px; border-width: 1px; border-radius: 8px; }
        .param-priority { background: var(--priority-bg); padding: 12px; border-radius: 12px; border: 2px solid var(--primary); }
        .param-priority label { color: var(--primary); }
        .param-priority input { border-color: var(--primary); font-weight: 600; }
        .actions { display: flex; gap: 15px; }
        .btn { flex: 1; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-generate { background: var(--primary); color: white; }
        .btn-clear { background: var(--border); color: var(--text-secondary); }
        .result-area { margin-top: 30px; padding: 25px; background: rgba(46, 204, 113, 0.1); border: 1px solid rgba(46, 204, 113, 0.2); border-radius: 20px; display: none; }
        .result-url-wrapper { position: relative; background: var(--input-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin: 15px 0; }
        .result-url { display: block; word-break: break-all; font-family: monospace; font-size: 12px; padding-right: 40px; color: var(--text); }
        .btn-copy { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--primary); color: white; border: none; width: 35px; height: 35px; border-radius: 6px; cursor: pointer; }
        .btn-test-link { width: 100%; background: #2ecc71; color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 14px; border-radius: 10px; font-weight: 600; }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2ecc71; color: white; padding: 10px 25px; border-radius: 50px; display: none; z-index: 1000; font-size: 13px; }
        footer { padding: 20px; text-align: center; font-size: 10px; color: var(--text-secondary); }
    </style>
</head>
<body>
<div class="smoke-bg"><div class="smoke-blob" style="top: 10%; left: 10%;"></div><div class="smoke-blob" style="bottom: 10%; right: 10%;"></div></div>
<div id="toast">Copiado!</div>
<div class="container">
    <header>
        <div class="logo-area"><div class="logo-circle">Gn</div><div class="brand"><h1>Nexis App</h1></div></div>
        <div class="header-actions">
            <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
            <div class="creator"><span style="font-size: 10px;">Dev by</span><br><strong>Iago</strong></div>
        </div>
    </header>
    <main>
        <div class="section-title"><i class="fa-solid fa-link"></i> 1. Template de Destino</div>
        <div class="platform-chips" id="platformChips">
            <div class="chip active" data-platform="google"><i class="fa-brands fa-google"></i>Google</div>
            <div class="chip" data-platform="facebook"><i class="fa-brands fa-facebook-f"></i>Facebook</div>
            <div class="chip" data-platform="tiktok"><i class="fa-brands fa-tiktok"></i>TikTok</div>
            <div class="chip" data-platform="taboola"><i class="fa-solid fa-bolt"></i>Taboola</div>
            <div class="chip" data-platform="custom"><i class="fa-solid fa-code"></i>Custom</div>
        </div>
        <div class="input-group">
            <label>Landing Page URL</label>
            <input type="text" id="lpUrl" placeholder="https://exemplo.com/pagina">
        </div>
        <div class="input-group">
            <label>Modelo de Acompanhamento</label>
            <textarea id="trackingTemplate" rows="3"></textarea>
        </div>
        <div class="section-title"><i class="fa-solid fa-fire"></i> 2. Parâmetros em Destaque</div>
        <div class="params-grid" id="paramsGrid"></div>
        <div class="actions">
            <button class="btn btn-clear" onclick="clearAll()">Limpar</button>
            <button class="btn btn-generate" onclick="generateLink()">Gerar Link de Teste</button>
        </div>
        <div class="result-area" id="resultArea">
            <label>Link Gerado:</label>
            <div class="result-url-wrapper">
                <code class="result-url" id="finalUrlDisplay"></code>
                <button class="btn-copy" onclick="copyToClipboard()"><i class="fa-solid fa-copy"></i></button>
            </div>
            <a href="#" target="_blank" id="testLink" class="btn-test-link">Abrir Link para Testar</a>
        </div>
    </main>
    <footer>Nexis Ultra Tester &copy; 2026</footer>
</div>
